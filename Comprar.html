<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - GYM-MLS</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/comprar.css">
</head>
<body>
    <header>
        <nav aria-label="Navegación principal">
            <a class="brand" href="Index.html" aria-label="GYM-MLS, inicio">GYM-<span class="color-mitad">MLS</span></a>
            <ul class="menu">
                <li class="items"><a href="Perfil.html">Perfil</a></li>
                <li class="items"><a href="Comprar.html" aria-current="page">Comprar</a></li>
                <li class="items"><a href="Rutinas.html">Rutinas</a></li>
                <li class="items"><a href="Clases.html">Clases</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="info">
            <h1>Tienda <span class="color-mitad">MLS</span></h1>
            <p>Equípate con lo mejor para potenciar tu entrenamiento</p>
        </section>

        <div class="checkout-container">
            <h2>Validar Cupón de Descuento</h2>
            <div class="coupon-box">
                <label for="coupon-input">Código de cupón</label>
                <input id="coupon-input" class="input-coupon" type="text" placeholder="Ingrese su código de cupón">
                <button id="coupon-btn" class="btn-coupon" type="button">Aplicar Cupón</button>
            </div>
            <p id="coupon-result" class="result-message"></p>
        </div>
    </main>
    <script src="js/comprar.js" defer></script>
</body>
</html>
