<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - GYM-MLS</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/pages.css">
    <link rel="stylesheet" href="CSS/perfil.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <nav class="main-nav" aria-label="Navegación principal">
                <a href="Index.html" class="brand-logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                        <path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M7.5 5v14M16.5 5v14" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>GYM-<span class="highlight">MLS</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="Index.html">Inicio</a></li>
                    <li><a href="Perfil.html" aria-current="page">Perfil</a></li>
                    <li><a href="Clases.html">Clases</a></li>
                    <li><a href="Rutinas.html">Rutinas</a></li>
                </ul>
                <div class="header-action"><a href="Comprar.html" class="btn-outline">TIENDA</a></div>
            </nav>
        </div>
    </header>
    <main>
        <section class="interior-hero">
            <div class="interior-hero-content">
                <p class="eyebrow">TU ESPACIO PERSONAL</p>
                <h1>Mi <span>perfil</span></h1>
                <p>Gestioná tu información personal y preferencias de entrenamiento.</p>
            </div>
        </section>

        <div class="profile-card">
            <h2 id="titulo" class="titulo principal">Perfil del Atleta</h2>
            <form id="formulario" class="formulario">
                <div class="form-field">
                    <label for="nombre">Nombre:</label>
                    <input id="nombre" name="nombre" class="input-field dato" type="text" maxlength="100" placeholder="Ingrese su nombre" required>
                </div>
                <div class="form-field">
                    <label for="contacto">Contacto:</label>
                    <input id="contacto" name="contacto" class="input-field dato" type="text" maxlength="100" placeholder="Ingrese su contacto" required>
                </div>
                <div class="form-field">
                    <label for="direccion">Dirección:</label>
                    <input id="direccion" name="direccion" class="input-field dato" type="text" maxlength="255" placeholder="Ingrese su dirección" required>
                </div>
                <div class="form-field">
                    <label for="fecha_registro">Fecha de registro:</label>
                    <input id="fecha_registro" name="fecha_registro" class="input-field dato" type="date" required>
                </div>
                <div class="form-field">
                    <label for="email">Email:</label>
                    <input id="email" name="email" class="input-field dato" type="email" maxlength="100" placeholder="Ingrese su email" required>
                </div>
                <p id="mensaje-formulario" role="status" aria-live="polite"></p>
                <button type="submit" class="btn-action">Agregar perfil</button>
            </form>
        </div>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <a class="brand-logo" href="Index.html">GYM-<span class="highlight">MLS</span></a>
            <p>&copy; 2026 GYM-MLS. Todos los derechos reservados.</p>
            <div class="footer-links">
                <a href="Perfil.html">Perfil</a>
                <a href="Rutinas.html">Rutinas</a>
                <a href="Clases.html">Clases</a>
            </div>
        </div>
    </footer>
    <script src="js/perfil.js" defer></script>
</body>
</html>
