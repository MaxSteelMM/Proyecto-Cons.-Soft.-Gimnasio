<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - GYM-MLS</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/perfil.css">
</head>
<body>
    <header>
        <nav aria-label="Navegación principal">
            <a class="brand" href="Index.html" aria-label="GYM-MLS, inicio">GYM-<span class="color-mitad">MLS</span></a>
            <ul class="menu">
                <li class="items"><a href="Perfil.html" aria-current="page">Perfil</a></li>
                <li class="items"><a href="Comprar.html">Comprar</a></li>
                <li class="items"><a href="Rutinas.html">Rutinas</a></li>
                <li class="items"><a href="Clases.html">Clases</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="info">
            <h1>Mi <span class="color-mitad">Perfil</span></h1>
            <p>Gestiona tu información personal y preferencias de entrenamiento</p>
        </section>

        <div class="profile-card">
            <h2 id="titulo" class="titulo principal">Perfil del Atleta</h2>
            <form id="formulario" class="formulario">
                <div class="form-field">
                    <label for="nombre">Nombre:</label>
                    <input id="nombre" class="input-field dato" type="text" placeholder="Ingrese su nombre">
                </div>
                <div class="form-field">
                    <label for="password">Contraseña:</label>
                    <input id="password" class="input-field dato" type="password" placeholder="Ingrese contraseña">
                </div>
                <div class="form-field">
                    <label for="foto">Foto de perfil:</label>
                    <input id="foto" class="input-field archivo" type="file" accept="image/png, image/jpeg">
                </div>

                <div class="actions">
                    <button type="button" id="btnEditar" class="btn-action">Editar título</button>
                    <button type="button" id="btnOcultar" class="btn-action">Ocultar/Mostrar título</button>
                    <button type="button" id="btnPassword" class="btn-action">Ver/Ocultar Contraseña</button>
                    <button type="button" id="btnColor" class="btn-action">Cambiar Estilos</button>
                    <button type="button" id="btnClase" class="btn-action">Modificar Clases</button>
                    <button type="button" id="btnInfo" class="btn-action">Info en Consola</button>
                </div>
            </form>
        </div>
    </main>
    <script src="js/perfil.js" defer></script>
</body>
</html>
